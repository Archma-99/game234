name: weather_app
description: A feature-rich weather application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.5

  # Networking & Services
  http: ^0.13.5
  weather: ^3.2.1
  geolocator: ^9.0.2

  # Utility
  intl: ^0.17.0
  shared_preferences: ^2.0.15

  # UI & Animations
  cupertino_icons: ^1.0.2
  flutter_animate: ^4.1.1
  fl_chart: ^0.55.0

  # Notifications
  flutter_local_notifications: ^9.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
